name: WidgetStudio
options:
  bundleIdPrefix: io.github.s12171934
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  WidgetStudio:
    type: application
    platform: iOS
    sources:
      - src/App
      - src/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.s12171934.widgetstudio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 위젯 스튜디오
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 위젯 배경으로 쓸 사진을 고릅니다.
        # 실기기는 키체인 공유(무료 팀 가능), 시뮬레이터는 App Group.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": src/App/WidgetStudio.device.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": src/App/WidgetStudio.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: src/App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [widgetstudio]
        UILaunchScreen: {}
        WSKeychainGroup: $(AppIdentifierPrefix)io.github.s12171934.widgetstudio.shared
    dependencies:
      - target: WidgetStudioWidget
  WidgetStudioWidget:
    type: app-extension
    platform: iOS
    sources:
      - src/Widget
      - src/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.s12171934.widgetstudio.widget
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": src/Widget/WidgetStudioWidget.device.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": src/Widget/WidgetStudioWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: src/Widget/Info.plist
      properties:
        CFBundleDisplayName: 위젯 스튜디오
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WSKeychainGroup: $(AppIdentifierPrefix)io.github.s12171934.widgetstudio.shared
  WidgetStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - tests/UITests
    dependencies:
      - target: WidgetStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WidgetStudio
        PRODUCT_BUNDLE_IDENTIFIER: io.github.s12171934.widgetstudio.uitests
schemes:
  WidgetStudio:
    build:
      targets:
        WidgetStudio: all
    test:
      targets:
        - WidgetStudioUITests
